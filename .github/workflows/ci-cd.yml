# Build, test and smoke-test the stack. Terraform validation and image publishing are added with the
# infrastructure (Phase 7).
name: CI

on:
  push:
    branches: [main, develop, 'v3/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --exit-code 1 --log-opts="--all"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify (tests + 90% line coverage gate)
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack and wait for healthy services
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Both roles are ready
        run: |
          curl -fsS localhost:8080/actuator/health/readiness
          curl -fsS localhost:8081/actuator/health/readiness
          curl -fsS localhost:8080/actuator/info | grep -q '"role":"api"'
          curl -fsS localhost:8081/actuator/info | grep -q '"role":"worker"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down
