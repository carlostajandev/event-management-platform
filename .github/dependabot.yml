# Weekly update PRs for dependencies, the base image and CI actions (supply chain).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      aws:
        patterns: ["software.amazon.awssdk:*", "io.awspring.cloud:*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
