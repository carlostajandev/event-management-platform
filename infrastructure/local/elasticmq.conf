# Local SQS emulator. Mirrors the queues defined in Terraform.
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  ticketing-orders-dlq {}

  ticketing-orders {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ticketing-orders-dlq"
      maxReceiveCount = 3
    }
  }
}
